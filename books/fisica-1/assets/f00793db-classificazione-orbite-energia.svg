<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Diagramma dei livelli energetici: Orbita iperbolica (Em &gt; 0), Orbita parabolica (Em = 0), Orbita ellittica (Em &lt; 0)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Diagramma dei livelli energetici: Orbita iperbolica (Em &gt; 0), Orbita parabolica (Em = 0), Orbita ellittica (Em &lt; 0)</title>
<rect width="640" height="420" fill="#FFFFFF"/>
<line x1="46" y1="374" x2="46" y2="30" stroke="#374151" stroke-width="1.6"/>
<polygon points="46,20 41.5,31 50.5,31" fill="#374151"/>
<text transform="translate(20 202) rotate(-90)" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">Energia meccanica E<tspan dy="3.08" font-size="10.08">m</tspan></text>
<g stroke="#111827" stroke-width="2.6" stroke-linecap="round"><line x1="315" y1="52" x2="379" y2="52"/><line x1="315" y1="204" x2="379" y2="204"/><line x1="315" y1="356" x2="379" y2="356"/></g>

<text x="387" y="56.5" font-size="13" fill="#111827">Orbita iperbolica (E<tspan dy="2.86" font-size="9.36">m</tspan><tspan dy="-2.86"> &gt; 0)</tspan></text>
<text x="387" y="208.5" font-size="13" fill="#111827">Orbita parabolica (E<tspan dy="2.86" font-size="9.36">m</tspan><tspan dy="-2.86"> = 0)</tspan></text>
<text x="387" y="360.5" font-size="13" fill="#111827">Orbita ellittica (E<tspan dy="2.86" font-size="9.36">m</tspan><tspan dy="-2.86"> &lt; 0)</tspan></text>
<text x="347" y="398" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">Tipo di orbita (L &gt; 0)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Diagramma dei livelli energetici: S₁, S₁ + Q/T₁, S₂, S₂ − Q/T₂" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Diagramma dei livelli energetici: S₁, S₁ + Q/T₁, S₂, S₂ − Q/T₂</title>
<rect width="640" height="420" fill="#FFFFFF"/>
<line x1="46" y1="374" x2="46" y2="30" stroke="#374151" stroke-width="1.6"/>
<polygon points="46,20 41.5,31 50.5,31" fill="#374151"/>
<text x="46" y="13" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">Entropia</text>
<g stroke="#111827" stroke-width="2.6" stroke-linecap="round"><line x1="164.62" y1="254.67" x2="260.38" y2="254.67"/><line x1="164.62" y1="52" x2="260.38" y2="52"/><line x1="433.62" y1="254.67" x2="529.38" y2="254.67"/><line x1="433.62" y1="356" x2="529.38" y2="356"/></g>


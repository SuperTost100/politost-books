<line x1="278.38" y1="254.67" x2="278.38" y2="60.5" stroke="#C2410C" stroke-width="1.8" stroke-linecap="round"/><polygon points="278.38,52 281.98,61 274.78,61" fill="#C2410C"/>
<text x="286.38" y="157.83" font-size="12.5" fill="#C2410C" font-weight="600">ΔS₁ = Q/T₁ &gt; 0</text>
<line x1="415.62" y1="254.67" x2="415.62" y2="347.5" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round"/><polygon points="415.62,356 412.02,347 419.22,347" fill="#1D4ED8"/>
<text x="407.62" y="309.83" font-size="12.5" text-anchor="end" fill="#1D4ED8" font-weight="600">ΔS₂ = −Q/T₂ &lt; 0</text>
<text x="156.62" y="259.17" font-size="13" text-anchor="end" fill="#111827">S₁</text>
<text x="156.62" y="56.5" font-size="13" text-anchor="end" fill="#111827">S₁ + Q/T₁</text>
<text x="537.38" y="259.17" font-size="13" fill="#111827">S₂</text>
<text x="537.38" y="360.5" font-size="13" fill="#111827">S₂ − Q/T₂</text>
